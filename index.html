<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BabyWatch by Hexaforge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glow-blue { box-shadow: 0 0 20px rgba(59, 130, 246, 0.3); }
        .glow-red  { box-shadow: 0 0 15px rgba(239, 68, 68, 0.5); }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col overflow-x-hidden antialiased select-none">

    <header class="w-full max-w-lg mx-auto px-6 pt-6 pb-2">
        <div class="flex items-center justify-between bg-zinc-900/60 backdrop-blur-lg border border-zinc-800/80 rounded-2xl px-4 py-3 shadow-xl">
            <div class="flex items-center space-x-3">
                <div class="relative flex h-3 w-3">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500 glow-red"></span>
                </div>
                <div>
                    <h1 class="text-md font-bold tracking-wide">BabyWatch</h1>
                    <p class="text-[10px] text-zinc-400 font-medium tracking-wider uppercase">Hexaforge IoT</p>
                </div>
            </div>
            <span class="text-xs font-semibold text-emerald-400" id="system-status">Bekleniyor...</span>
        </div>
    </header>

    <main class="flex-grow w-full max-w-lg mx-auto px-6 py-4 flex flex-col justify-center space-y-5">
        <div class="relative aspect-[4/3] w-full bg-zinc-900 border border-zinc-800/80 rounded-3xl overflow-hidden shadow-2xl glow-blue flex items-center justify-center">

            <img id="stream-viewer" class="w-full h-full object-cover hidden" alt="" />

            <div id="placeholder" class="flex flex-col items-center justify-center space-y-3 text-center px-6">
                <div class="p-4 bg-zinc-950/60 rounded-full border border-zinc-800/50 animate-pulse">
                    <svg class="w-8 h-8 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                    </svg>
                </div>
                <p class="text-zinc-400 text-sm font-semibold">Dişliye bas, IP'yi gir</p>
            </div>

            <div class="absolute top-4 left-4 bg-black/50 backdrop-blur-md border border-white/10 px-3 py-1 rounded-full text-[10px] font-bold tracking-wider text-white uppercase flex items-center space-x-1.5">
                <span class="h-1.5 w-1.5 rounded-full bg-red-500 animate-pulse"></span>
                <span>Canlı</span>
            </div>

            <button id="settings-btn" type="button" class="absolute top-4 right-4 bg-black/50 backdrop-blur-md border border-white/10 p-2 rounded-full text-zinc-300 transition-all active:scale-90">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
            </button>

            <div id="ip-card" class="absolute inset-x-6 bottom-6 bg-zinc-900/95 backdrop-blur-lg border border-zinc-700 p-4 rounded-2xl shadow-2xl hidden">
                <p class="text-xs font-semibold text-indigo-400 mb-2">ESP32-CAM IP Adresi</p>
                <div class="flex space-x-2">
                    <input id="ip-input" type="text" placeholder="Örn: 192.168.43.10" class="flex-grow bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2 text-sm font-semibold text-zinc-100 focus:outline-none focus:border-indigo-500">
                    <button id="ip-save-btn" type="button" class="bg-indigo-600 text-white font-bold text-xs px-4 py-2 rounded-xl active:scale-95 transition-all">Bağlan</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="w-full max-w-lg mx-auto px-6 pb-6 text-center">
        <p class="text-[10px] text-zinc-600 tracking-wider font-semibold uppercase">Hexaforge Embedded Engineering &copy; 2026</p>
    </footer>

    <script>
        // Eski PWA service worker varsa kaldır (bozuk önbellek / HTTPS karışıklığı)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((r) => r.unregister()));
        }

        let espIP = localStorage.getItem('esp32_ip') || '';

        const streamViewer = document.getElementById('stream-viewer');
        const placeholder   = document.getElementById('placeholder');
        const systemStatus  = document.getElementById('system-status');
        const settingsBtn   = document.getElementById('settings-btn');
        const ipCard        = document.getElementById('ip-card');
        const ipInput       = document.getElementById('ip-input');
        const ipSaveBtn     = document.getElementById('ip-save-btn');

        if (espIP) ipInput.value = espIP;

        settingsBtn.addEventListener('click', () => ipCard.classList.toggle('hidden'));

        ipSaveBtn.addEventListener('click', () => {
            let raw = ipInput.value.trim();
            try { raw = new URL(raw.includes('://') ? raw : 'http://' + raw).hostname; } catch (e) {}
            raw = raw.split('/')[0];

            if (!raw) return;
            espIP = raw;
            localStorage.setItem('esp32_ip', espIP);
            ipCard.classList.add('hidden');
            connect();
        });

        function connect() {
            if (!espIP) return;
            const url = 'http://' + espIP + '/stream';
            systemStatus.textContent = 'Bağlanıyor...';

            const test = new Image();
            test.onload = () => {
                streamViewer.src = url;
                streamViewer.classList.remove('hidden');
                placeholder.classList.add('hidden');
                systemStatus.textContent = 'Yayında ✓';
            };
            test.onerror = () => {
                systemStatus.textContent = 'Bağlanamadı, tekrar deneniyor...';
                setTimeout(connect, 5000);
            };
            test.src = url;
        }

        if (espIP) connect();
    </script>
</body>
</html>
