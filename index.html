<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BabyWatch by Hexaforge</title>
    
    <!-- PWA & Mobil Entegrasyon Ayarları -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#09090b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BabyWatch">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1684/1684426.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .glow-red {
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
        }
        .glow-green {
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.5);
        }
        .glow-blue {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col justify-between overflow-x-hidden antialiased select-none">

    <!-- Top Header -->
    <header class="w-full max-w-lg mx-auto px-6 pt-6 pb-2">
        <div class="flex items-center justify-between bg-zinc-900/60 backdrop-blur-lg border border-zinc-800/80 rounded-2xl px-4 py-3 shadow-xl">
            <div class="flex items-center space-x-3">
                <div class="relative flex h-3 w-3">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500 glow-red"></span>
                </div>
                <div>
                    <h1 class="text-md font-bold tracking-wide text-zinc-100">BabyWatch</h1>
                    <p class="text-[10px] text-zinc-400 font-medium tracking-wider uppercase">Hexaforge IoT</p>
                </div>
            </div>
            
            <!-- WiFi & Battery Indicators (Simulated) -->
            <div class="flex items-center space-x-4">
                <div class="flex items-center space-x-1.5" title="Bağlantı Durumu">
                    <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 18h.01M8 14a5 5 0 018 0M5 10a9 9 0 0114 0M2 6a14 14 0 0120 0"/>
                    </svg>
                    <span class="text-xs font-semibold text-emerald-400">Aktif</span>
                </div>
                
                <div class="flex items-center space-x-1.5" title="Tahmini Pil">
                    <div class="relative w-6 h-3 border border-zinc-400 rounded-sm p-[1px] flex items-center">
                        <div class="h-full bg-emerald-500 rounded-2xs" style="width: 100%"></div>
                        <div class="absolute -right-[3px] top-1/2 -translate-y-1/2 w-[2px] h-1.5 bg-zinc-400 rounded-r-xs"></div>
                    </div>
                    <span class="text-xs font-bold text-emerald-400">100%</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Viewport -->
    <main class="flex-grow w-full max-w-lg mx-auto px-6 py-2 flex flex-col justify-center space-y-5">
        
        <!-- Video Frame Screen -->
        <div class="relative aspect-[4/3] w-full bg-zinc-900 border border-zinc-800/80 rounded-3xl overflow-hidden shadow-2xl glow-blue flex items-center justify-center">
            
            <!-- MJPEG Live Stream Image -->
            <img id="stream-viewer" src="" alt="Canlı Yayın Bekleniyor..." class="w-full h-full object-cover hidden" />
            
            <!-- Loading/Placeholder State -->
            <div id="stream-placeholder" class="flex flex-col items-center justify-center space-y-4 text-zinc-500 px-6 text-center">
                <div class="p-4 bg-zinc-950/60 rounded-full border border-zinc-800/50 animate-pulse">
                    <svg class="w-8 h-8 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                    </svg>
                </div>
                <div>
                    <h3 class="text-zinc-300 font-semibold text-sm" id="placeholder-title">Bağlantı Bekleniyor</h3>
                    <p class="text-xs text-zinc-500 mt-1" id="placeholder-sub">Sağ üstteki ayar dişlisinden ESP32 IP adresini ayarlayın.</p>
                </div>
            </div>
            
            <!-- HUD Indicators -->
            <div class="absolute top-4 left-4 bg-black/50 backdrop-blur-md border border-white/10 px-3 py-1 rounded-full text-[10px] font-bold tracking-wider text-white uppercase flex items-center space-x-1.5 shadow-md">
                <span class="h-1.5 w-1.5 rounded-full bg-red-500 animate-pulse"></span>
                <span>Yayın</span>
            </div>

            <!-- AYAR DİŞLİSİ (ESP32 IP Ayarı İçin) -->
            <button id="settings-btn" class="absolute top-4 right-4 bg-black/50 hover:bg-zinc-900 backdrop-blur-md border border-white/10 p-1.5 rounded-full text-zinc-300 transition-all hover:scale-105 active:scale-95 shadow-md focus:outline-none" title="ESP32 IP Ayarları">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
            </button>

            <!-- GİZLİ IP AYAR KARTI -->
            <div id="ip-card" class="absolute inset-x-6 bottom-6 bg-zinc-900/90 backdrop-blur-lg border border-zinc-800 p-4 rounded-2xl shadow-2xl transition-all duration-300 transform translate-y-10 opacity-0 pointer-events-none">
                <p class="text-xs font-semibold text-indigo-400 mb-2">ESP32-CAM Bağlantı Ayarı</p>
                <div class="flex space-x-2">
                    <input type="text" id="ip-input" placeholder="IP veya Tünel Linki Girin" class="flex-grow bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs font-semibold text-zinc-100 focus:outline-none focus:border-indigo-500">
                    <button id="ip-save-btn" class="bg-indigo-600 hover:bg-indigo-550 active:scale-95 text-white font-bold text-xs px-4 py-2 rounded-xl transition-all">Kaydet</button>
                </div>
            </div>
        </div>

        <!-- Controls Dashboard -->
        <div class="grid grid-cols-2 gap-4">
            <!-- Audio Toggle Card (Phase 2 Locked) -->
            <button id="audio-btn" disabled class="flex flex-col items-center justify-center p-5 bg-zinc-900/40 backdrop-blur-lg border border-zinc-800/40 rounded-3xl opacity-50 cursor-not-allowed text-center shadow-lg group focus:outline-none">
                <div class="p-4 bg-zinc-950/40 border border-zinc-900/50 rounded-2xl mb-3 text-zinc-650 shadow-inner">
                    <svg class="w-7 h-7 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                </div>
                <span class="text-sm font-semibold tracking-wide text-zinc-500">Ses Dinleme</span>
                <span class="text-[10px] text-indigo-400 font-semibold uppercase tracking-wider mt-0.5">Faz 2 Entegrasyonu</span>
            </button>

            <!-- IR Night Vision Card (Locked/Phase 2) -->
            <button id="ir-btn" disabled class="flex flex-col items-center justify-center p-5 bg-zinc-900/40 backdrop-blur-lg border border-zinc-800/40 rounded-3xl opacity-50 cursor-not-allowed text-center shadow-lg group focus:outline-none">
                <div class="p-4 bg-zinc-950/40 border border-zinc-900/50 rounded-2xl mb-3 text-zinc-650 shadow-inner">
                    <svg class="w-7 h-7 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                    </svg>
                </div>
                <span class="text-sm font-semibold tracking-wide text-zinc-300">Gece Görüşü</span>
                <span class="text-[10px] text-indigo-400 font-semibold uppercase tracking-wider mt-0.5">Faz 2 Entegrasyonu</span>
            </button>
        </div>
        
        <!-- Live Diagnostics & Stats -->
        <div class="bg-zinc-900/40 backdrop-blur-lg border border-zinc-850 rounded-2xl p-4 flex items-center justify-between text-xs text-zinc-400">
            <div class="flex items-center space-x-2">
                <div class="h-2 w-2 rounded-full bg-emerald-500 glow-green animate-pulse"></div>
                <span class="font-medium">Sistem: <span class="text-zinc-200" id="system-status">Çalışıyor</span></span>
            </div>
            <div class="flex items-center space-x-2">
                <span class="font-medium">Yayın Formatı: <span class="text-zinc-200">MJPEG (VGA)</span></span>
            </div>
        </div>
        
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-lg mx-auto px-6 pb-6 pt-2 text-center">
        <p class="text-[10px] text-zinc-600 tracking-wider font-semibold uppercase">Hexaforge Embedded Engineering &copy; 2026</p>
    </footer>

    <!-- Web Audio & Control Logic -->
    <script>
        let espIP = "";
        const httpPort = "80";
        
        const streamViewer = document.getElementById('stream-viewer');
        const streamPlaceholder = document.getElementById('stream-placeholder');
        const systemStatus = document.getElementById('system-status');
        const placeholderTitle = document.getElementById('placeholder-title');
        const placeholderSub = document.getElementById('placeholder-sub');
        
        const settingsBtn = document.getElementById('settings-btn');
        const ipCard = document.getElementById('ip-card');
        const ipInput = document.getElementById('ip-input');
        const ipSaveBtn = document.getElementById('ip-save-btn');

        // Tarayıcı hafızasından kayıtlı IP'yi oku
        const savedIP = localStorage.getItem('esp32_ip');
        if (savedIP) {
            espIP = savedIP;
            ipInput.value = savedIP;
        }

        // Ayarlar kartını göster/gizle
        let isSettingsOpen = false;
        settingsBtn.addEventListener('click', () => {
            isSettingsOpen = !isSettingsOpen;
            if (isSettingsOpen) {
                ipCard.classList.remove('pointer-events-none', 'opacity-0', 'translate-y-10');
                ipCard.classList.add('opacity-100', 'translate-y-0');
            } else {
                ipCard.classList.add('pointer-events-none', 'opacity-0', 'translate-y-10');
                ipCard.classList.remove('opacity-100', 'translate-y-0');
            }
        });

        // IP / Link Kaydetme ve Yayın Başlatma (KURŞUN GEÇİRMEZ AYIKLAYICI)
        ipSaveBtn.addEventListener('click', () => {
            let typedIP = ipInput.value.trim();
            if (typedIP) {
                // 1. Önce başındaki http:// veya https:// protokollerini temizle
                typedIP = typedIP.replace(/^(http|https):\/\//i, '');
                
                // 2. Sonundaki /stream, /control vb. tüm alt yolları temizle
                typedIP = typedIP.split('/')[0];
                
                // 3. Temizlenmiş IP/Host bilgisini kaydet ve eşitle
                localStorage.setItem('esp32_ip', typedIP);
                espIP = typedIP;
                
                // Ayar kartını kapat
                isSettingsOpen = false;
                ipCard.classList.add('pointer-events-none', 'opacity-0', 'translate-y-10');
                ipCard.classList.remove('opacity-100', 'translate-y-0');
                
                // Bağlantıyı yenile
                systemStatus.textContent = "Bağlanıyor...";
                placeholderTitle.textContent = "Bağlanılıyor...";
                placeholderSub.textContent = `${espIP} adresindeki kameraya erişiliyor.`;
                streamViewer.classList.add('hidden');
                streamPlaceholder.classList.remove('hidden');
                
                startStream();
            }
        });

        function startStream() {
            if (!espIP) {
                systemStatus.textContent = "IP Yapılandırılmadı";
                return;
            }
            
            // Eğer host adresi sadece sayılardan oluşuyorsa (Örn: 10.59.74.41) HTTP, 
            // Harf içeriyorsa (localtunnel, ngrok tüneli vb.) HTTPS protokolünü seç.
            const isIP = /^[0-9.]+$/.test(espIP);
            const streamUrl = isIP ? `http://${espIP}:${httpPort}/stream` : `https://${espIP}/stream`;
            
            console.log("Bağlanılan Yayın URL'si:", streamUrl);
            
            const tempImg = new Image();
            tempImg.onload = () => {
                streamViewer.src = streamUrl;
                streamViewer.classList.remove('hidden');
                streamPlaceholder.classList.add('hidden');
                systemStatus.textContent = "Canlı Görüntü Aktif";
            };
            tempImg.onerror = () => {
                console.log("Kameraya ulaşılamıyor, 5 saniye sonra tekrar denenecek...");
                setTimeout(startStream, 5000);
            };
            tempImg.src = streamUrl;
        }

        // Başlangıçta yayını başlat
        window.addEventListener('DOMContentLoaded', () => {
            if (espIP) {
                startStream();
            }
        });

        // SERVICE WORKER KAPSAMLI KAYIT (PWA İçin)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('PWA Service Worker Kaydedildi!', reg))
                    .catch(err => console.log('Service Worker Hatası:', err));
            });
        }
    </script>
</body>
</html>
